<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Applications - Multi-Stack AI Agent Platform</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            min-height: 100vh;
            color: #e4e4e4;
        }
        .header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            padding: 1.5rem 2rem;
            box-shadow: 0 4px 20px rgba(0,0,0,0.3);
        }
        .header h1 { font-size: 1.8rem; margin-bottom: 0.5rem; }
        .header p { opacity: 0.9; font-size: 0.95rem; }
        .nav {
            display: flex;
            gap: 0.75rem;
            margin-top: 1rem;
            flex-wrap: wrap;
        }
        .nav a {
            background: rgba(255,255,255,0.2);
            color: white;
            padding: 0.5rem 1rem;
            border-radius: 20px;
            text-decoration: none;
            font-size: 0.85rem;
            font-weight: 600;
            transition: all 0.2s;
        }
        .nav a:hover { background: rgba(255,255,255,0.3); transform: translateY(-2px); }
        .nav a.active { background: rgba(255,255,255,0.4); }

        .container { max-width: 1400px; margin: 0 auto; padding: 2rem; }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 1.5rem;
            margin-bottom: 2rem;
        }
        .stat-card {
            background: rgba(255,255,255,0.05);
            border-radius: 16px;
            padding: 1.5rem;
            text-align: center;
            border: 1px solid rgba(255,255,255,0.1);
        }
        .stat-card .value {
            font-size: 2.5rem;
            font-weight: 700;
            background: linear-gradient(135deg, #667eea, #764ba2);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .stat-card .label { color: #888; margin-top: 0.5rem; }

        .apps-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(400px, 1fr));
            gap: 1.5rem;
        }
        .app-card {
            background: rgba(255,255,255,0.05);
            border-radius: 16px;
            padding: 1.5rem;
            border: 1px solid rgba(255,255,255,0.1);
            transition: all 0.3s;
        }
        .app-card:hover {
            transform: translateY(-4px);
            box-shadow: 0 12px 40px rgba(102, 126, 234, 0.2);
            border-color: rgba(102, 126, 234, 0.3);
        }
        .app-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 1rem;
        }
        .app-name {
            font-size: 1.4rem;
            font-weight: 700;
            color: #fff;
        }
        .app-type {
            background: rgba(102, 126, 234, 0.2);
            color: #667eea;
            padding: 0.25rem 0.75rem;
            border-radius: 12px;
            font-size: 0.75rem;
            font-weight: 600;
        }
        .app-description {
            color: #aaa;
            margin-bottom: 1rem;
            font-size: 0.9rem;
        }
        .app-path {
            background: rgba(0,0,0,0.3);
            padding: 0.5rem 0.75rem;
            border-radius: 8px;
            font-family: monospace;
            font-size: 0.8rem;
            color: #888;
            margin-bottom: 1rem;
            word-break: break-all;
        }
        .stacks {
            display: flex;
            gap: 0.5rem;
            flex-wrap: wrap;
            margin-bottom: 1rem;
        }
        .stack-tag {
            background: rgba(118, 75, 162, 0.2);
            color: #b794f6;
            padding: 0.25rem 0.75rem;
            border-radius: 12px;
            font-size: 0.8rem;
            font-weight: 500;
        }
        .app-stats {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 1rem;
            padding-top: 1rem;
            border-top: 1px solid rgba(255,255,255,0.1);
        }
        .app-stat {
            text-align: center;
        }
        .app-stat .num {
            font-size: 1.5rem;
            font-weight: 700;
            color: #667eea;
        }
        .app-stat .lbl {
            font-size: 0.75rem;
            color: #888;
        }
        .app-actions {
            display: flex;
            gap: 0.5rem;
            margin-top: 1rem;
        }
        .btn {
            padding: 0.5rem 1rem;
            border-radius: 8px;
            border: none;
            cursor: pointer;
            font-size: 0.85rem;
            font-weight: 600;
            transition: all 0.2s;
        }
        .btn-primary {
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
        }
        .btn-primary:hover { transform: translateY(-2px); box-shadow: 0 4px 12px rgba(102,126,234,0.4); }
        .btn-secondary {
            background: rgba(255,255,255,0.1);
            color: #e4e4e4;
        }
        .btn-secondary:hover { background: rgba(255,255,255,0.15); }
        .btn-danger {
            background: linear-gradient(135deg, #dc3545, #c82333);
            color: white;
        }
        .btn-danger:hover { transform: translateY(-2px); box-shadow: 0 4px 12px rgba(220,53,69,0.4); }

        .empty-state {
            text-align: center;
            padding: 4rem 2rem;
            color: #888;
        }
        .empty-state h3 { margin-bottom: 1rem; color: #aaa; }

        .loading {
            text-align: center;
            padding: 2rem;
            color: #888;
        }
        .loading::after {
            content: '';
            animation: dots 1.5s infinite;
        }
        @keyframes dots {
            0%, 20% { content: '.'; }
            40% { content: '..'; }
            60%, 100% { content: '...'; }
        }

        /* Modal Styles */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0,0,0,0.8);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 1000;
            opacity: 0;
            visibility: hidden;
            transition: all 0.3s;
        }
        .modal-overlay.active {
            opacity: 1;
            visibility: visible;
        }
        .modal {
            background: #1a1a2e;
            border-radius: 16px;
            width: 90%;
            max-width: 900px;
            max-height: 85vh;
            overflow-y: auto;
            border: 1px solid rgba(102, 126, 234, 0.3);
            box-shadow: 0 20px 60px rgba(0,0,0,0.5);
            transform: translateY(20px);
            transition: transform 0.3s;
        }
        .modal-overlay.active .modal {
            transform: translateY(0);
        }
        .modal-header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            padding: 1.5rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: sticky;
            top: 0;
            z-index: 10;
        }
        .modal-tabs {
            display: flex;
            background: rgba(0,0,0,0.2);
            padding: 0.5rem;
            gap: 0.5rem;
        }
        .tab-btn {
            flex: 1;
            padding: 0.75rem 1rem;
            border: none;
            background: transparent;
            color: #888;
            font-weight: 600;
            cursor: pointer;
            border-radius: 8px;
            transition: all 0.2s;
        }
        .tab-btn:hover {
            background: rgba(255,255,255,0.05);
            color: #fff;
        }
        .tab-btn.active {
            background: rgba(102, 126, 234, 0.3);
            color: #fff;
        }
        .domain-card {
            background: rgba(255,255,255,0.05);
            border-radius: 12px;
            padding: 1rem;
            margin-bottom: 0.75rem;
            border: 1px solid rgba(255,255,255,0.1);
            cursor: pointer;
            transition: all 0.2s;
        }
        .domain-card:hover {
            background: rgba(255,255,255,0.08);
            border-color: rgba(102, 126, 234, 0.3);
        }
        .domain-name {
            font-weight: 600;
            color: #fff;
            margin-bottom: 0.25rem;
        }
        .domain-meta {
            font-size: 0.8rem;
            color: #888;
        }
        .constitution-section {
            background: rgba(102, 126, 234, 0.1);
            border-radius: 12px;
            padding: 1rem;
            margin-bottom: 1rem;
            border: 1px solid rgba(102, 126, 234, 0.2);
        }
        .constitution-section h4 {
            color: #667eea;
            margin-bottom: 0.5rem;
        }
        .risk-item {

            border-radius: 8px;

            border-left: 3px solid #ffc107;

        .risk-item.medium { border-left-color: #ffc107; background: rgba(255, 193, 7, 0.1); }

        .modal-title {
            font-size: 1.5rem;
            font-weight: 700;
        }
        .modal-status {
            background: rgba(255,255,255,0.2);
            padding: 0.25rem 0.75rem;
            border-radius: 12px;
            font-size: 0.8rem;
        }
        .modal-close {
            background: rgba(255,255,255,0.2);
            border: none;
            color: white;
            width: 36px;
            height: 36px;
            border-radius: 50%;
            cursor: pointer;
            font-size: 1.2rem;
            transition: all 0.2s;
        }
        .modal-close:hover {
            background: rgba(255,255,255,0.3);
            transform: scale(1.1);
        }
        .modal-body {
            padding: 1.5rem;
        }
        .progress-section {
            margin-bottom: 1.5rem;
        }
        .progress-label {
            display: flex;
            justify-content: space-between;
            margin-bottom: 0.5rem;
            font-size: 0.9rem;
            color: #aaa;
        }
        .progress-bar {
            height: 12px;
            background: rgba(255,255,255,0.1);
            border-radius: 6px;

        }
        .progress-fill {
            height: 100%;
            background: linear-gradient(135deg, #667eea, #764ba2);

        }
        .stats-section {
            display: grid;
            grid-template-columns: repeat(4, 1fr);

        }
        .stat-item {
            background: rgba(255,255,255,0.05);
            padding: 1rem;
            border-radius: 12px;
            text-align: center;
        }
        .stat-item .num {
            font-size: 1.8rem;
            font-weight: 700;
            color: #667eea;
        }
        .stat-item .lbl {
            font-size: 0.75rem;
            color: #888;
        }
        .epics-section h3 {
            margin-bottom: 1rem;
            color: #ccc;
            font-size: 1.1rem;
        }
        .epic-card {
            background: rgba(255,255,255,0.05);
            border-radius: 12px;
            margin-bottom: 1rem;
            border: 1px solid rgba(255,255,255,0.1);
            overflow: hidden;
        }
        .epic-header {
            padding: 1rem;
            cursor: pointer;
            display: flex;
            justify-content: space-between;
            align-items: center;
            transition: background 0.2s;
        }
        .epic-header:hover {
            background: rgba(255,255,255,0.05);
        }
        .epic-title {
            font-weight: 600;
            color: #fff;
        }
        .epic-meta {
            display: flex;
            gap: 1rem;
            align-items: center;
        }
        .epic-badge {
            background: rgba(102, 126, 234, 0.2);
            color: #667eea;
            padding: 0.25rem 0.5rem;
            border-radius: 8px;
            font-size: 0.75rem;
        }
        .epic-points {

        .epic-expand {
            color: #667eea;
            transition: transform 0.3s;
        }

        .stories-list {

        }

            border-radius: 8px;

            justify-content: space-between;

        }
        .story-title {
            color: #ccc;

        }

        .no-backlog {

        .no-backlog h4 {

        /* Drill-down Styles */
        .drill-nav {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            margin-bottom: 1rem;
            flex-wrap: wrap;
        }
        .drill-crumb {
            color: #667eea;
            cursor: pointer;
            font-size: 0.9rem;
        }
        .drill-crumb:hover { text-decoration: underline; }
        .drill-sep { color: #555; }
        .drill-current { color: #fff; font-weight: 600; }
        .drill-back {
            background: rgba(102, 126, 234, 0.2);
            border: none;
            color: #667eea;
            padding: 0.5rem 1rem;
            border-radius: 8px;
            cursor: pointer;
            font-size: 0.9rem;
            margin-right: 1rem;
            transition: all 0.2s;
        }
        .drill-back:hover { background: rgba(102, 126, 234, 0.3); }
        .drill-item {
            background: rgba(255,255,255,0.05);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 12px;
            padding: 1rem;
            margin-bottom: 0.75rem;
            cursor: pointer;
            transition: all 0.2s;

            justify-content: space-between;

        }

            padding: 0.2rem 0.6rem;

        }
        .task-item {
            background: rgba(255,255,255,0.03);
            border-left: 3px solid #667eea;
            padding: 0.75rem 1rem;
            margin-bottom: 0.5rem;

<body>
    <div class="header">
        <h1>📦 Applications</h1>
        <p>Overzicht van geregistreerde projecten en hun status</p>
        <nav class="nav">
            <a href="index.html">🏠 Hub</a>
            <a href="project-intake.html">📥 Intake</a>
            <a href="applications.html" class="active">📦 Applications</a>
            <a href="agent-dashboard.html">🤖 Agents</a>
            <a href="quality-dashboard.html">✅ Quality</a>
            <a href="observability-dashboard.html">👁️ Observability</a>
        </nav>
    </div>

    <div class="container">
        <div class="stats-grid" id="stats">
            <div class="stat-card">
                <div class="value" id="totalApps">-</div>
                <div class="label">Applications</div>
            </div>
            <div class="stat-card">
                <div class="value" id="totalStacks">-</div>
                <div class="label">Tech Stacks</div>
            </div>
            <div class="stat-card">
                <div class="value" id="totalComponents">-</div>
                <div class="label">Components</div>
            </div>
            <div class="stat-card">
                <div class="value" id="totalAgents">-</div>
                <div class="label">Agents</div>
            </div>
        </div>

        <div id="appsContainer" class="apps-grid">
            <div class="loading">Applicaties laden</div>
        </div>
    </div>

    <!-- Details Modal -->
    <div id="detailsModal" class="modal-overlay" onclick="closeModalOnOverlay(event)">
        <div class="modal">
            <div class="modal-header">
                <div>
                    <span class="modal-title" id="modalTitle">Project Details</span>
                    <span class="modal-status" id="modalStatus">ACTIVE</span>
                </div>
                <button class="modal-close" onclick="closeModal()">&times;</button>
            </div>
            <div class="modal-tabs">
                <button class="tab-btn active" onclick="switchTab('backlog')" id="tabBacklog">Backlog (TO-BE)</button>
                <button class="tab-btn" onclick="switchTab('analysis')" id="tabAnalysis">Code Analysis (AS-IS)</button>
            </div>
            <div class="modal-body" id="modalBody">
                <div class="loading">Backlog laden</div>
            </div>
        </div>
    </div>

    <script>
        const API_BASE = '/api';

        // Drill-down state
        let currentBacklog = null;
        let navigationStack = [];
        let currentAppId = null;

        async function loadApplications() {
            try {
                const response = await fetch(`${API_BASE}/applications/`);
                if (!response.ok) throw new Error('Failed to load applications');

                const apps = await response.json();

                // Deduplicate by name (prefer root_path without /src suffix for backlog access)
                const uniqueApps = {};
                apps.forEach(app => {
                    const existing = uniqueApps[app.name];
                    if (!existing) {
                        uniqueApps[app.name] = app;
                    } else {
                        // Prefer app with shorter root_path (without /src suffix) for better backlog access
                        const existingHasSrc = existing.root_path.endsWith('/src');
                        const newHasSrc = app.root_path.endsWith('/src');
                        if (existingHasSrc && !newHasSrc) {
                            uniqueApps[app.name] = app; // Prefer non-/src path
                        }
                    }
                });
                const dedupedApps = Object.values(uniqueApps);

                // Update stats
                const allStacks = new Set();
                let totalComponents = 0;
                let totalAgents = 0;

                dedupedApps.forEach(app => {
                    (app.primary_stacks || []).forEach(s => allStacks.add(s));
                    totalComponents += app.total_components || 0;
                    totalAgents += app.total_agents || 0;
                });

                document.getElementById('totalApps').textContent = dedupedApps.length;
                document.getElementById('totalStacks').textContent = allStacks.size;
                document.getElementById('totalComponents').textContent = totalComponents;
                document.getElementById('totalAgents').textContent = totalAgents;

                // Render apps
                const container = document.getElementById('appsContainer');

                if (dedupedApps.length === 0) {
                    container.innerHTML = `
                        <div class="empty-state">
                            <h3>Geen applicaties gevonden</h3>
                            <p>Gebruik de <a href="project-intake.html" style="color: #667eea;">Project Intake</a> om een project te registreren.</p>
                        </div>
                    `;
                    return;
                }

                container.innerHTML = dedupedApps.map(app => `
                    <div class="app-card">
                        <div class="app-header">
                            <div class="app-name">${app.name}</div>
                            <div class="app-type">${app.application_type || 'project'}</div>
                        </div>
                        <div class="app-description">${app.description || 'Geen beschrijving'}</div>
                        <div class="app-path">${app.root_path}</div>
                        <div class="stacks">
                            ${(app.primary_stacks || []).map(s => `<span class="stack-tag">${s}</span>`).join('')}
                        </div>
                        <div class="app-stats">
                            <div class="app-stat">
                                <div class="num">${app.total_components || 0}</div>
                                <div class="lbl">Components</div>
                            </div>
                            <div class="app-stat">
                                <div class="num">${app.total_agents || 0}</div>
                                <div class="lbl">Agents</div>
                            </div>
                            <div class="app-stat">
                                <div class="num">${Object.keys(app.components_by_type || {}).length}</div>
                                <div class="lbl">Types</div>
                            </div>
                        </div>
                        <div class="app-actions">
                            <button class="btn btn-primary" onclick="viewDetails(${app.id})">📋 Details</button>
                            <button class="btn btn-secondary" onclick="openDocs('${app.root_path}')">📄 Docs</button>
                            <button class="btn btn-secondary" onclick="runTests('${app.name}')">🧪 Tests</button>
                            <button class="btn btn-danger" onclick="deleteProject(${app.project_id || app.id}, '${app.name}')" title="Verwijder project en alle data">🗑️</button>
                        </div>
                    </div>
                `).join('');

            } catch (error) {
                console.error('Error loading applications:', error);
                document.getElementById('appsContainer').innerHTML = `
                    <div class="empty-state">
                        <h3>Fout bij laden</h3>
                        <p>${error.message}</p>
                    </div>
                `;
            }
        }

        async function viewDetails(appId) {
            const modal = document.getElementById('detailsModal');
            const modalBody = document.getElementById('modalBody');
            const modalTitle = document.getElementById('modalTitle');
            const modalStatus = document.getElementById('modalStatus');

            // Reset state
            currentAppId = appId;
            navigationStack = [];
            currentBacklog = null;

            // Show modal with loading state
            modalBody.innerHTML = '<div class="loading">Backlog laden</div>';
            modal.classList.add('active');

            try {
                // Use nested endpoint for full drill-down data
                const response = await fetch(`${API_BASE}/applications/${appId}/backlog/nested`);

                if (!response.ok) {
                    throw new Error('Backlog niet gevonden');
                }

                currentBacklog = await response.json();

                // Update header
                modalTitle.textContent = currentBacklog.name;
                modalStatus.textContent = currentBacklog.status;

                // Check if backlog has data
                if (!currentBacklog.epics || currentBacklog.epics.length === 0) {
                    modalBody.innerHTML = `
                        <div class="no-backlog">
                            <h4>Geen backlog gevonden</h4>
                            <p>Dit project heeft nog geen doc/project/ folder met epics.</p>
                        </div>
                    `;
                    return;
                }

                // Render epics (top level)
                renderEpics();

            } catch (error) {
                console.error('Error loading backlog:', error);
                modalBody.innerHTML = `
                    <div class="no-backlog">
                        <h4>Fout bij laden</h4>
                        <p>${error.message}</p>
                    </div>
                `;
            }
        }

        function renderEpics() {
            const modalBody = document.getElementById('modalBody');
            const backlog = currentBacklog;

            modalBody.innerHTML = `
                <div class="progress-section">
                    <div class="progress-label">
                        <span>Voortgang</span>
                        <span>${backlog.completed_story_points} / ${backlog.total_story_points} SP (${backlog.progress_percent}%)</span>
                    </div>
                    <div class="progress-bar">
                        <div class="progress-fill" style="width: ${backlog.progress_percent}%"></div>
                    </div>
                </div>

                <div class="stats-section">
                    <div class="stat-item">
                        <div class="num">${backlog.statistics.total_epics || 0}</div>
                        <div class="lbl">Epics</div>
                    </div>
                    <div class="stat-item">
                        <div class="num">${backlog.statistics.total_features || 0}</div>
                        <div class="lbl">Features</div>
                    </div>
                    <div class="stat-item">
                        <div class="num">${backlog.statistics.total_stories || 0}</div>
                        <div class="lbl">Stories</div>
                    </div>
                    <div class="stat-item">
                        <div class="num">${backlog.statistics.total_tasks || 0}</div>
                        <div class="lbl">Tasks</div>
                    </div>
                </div>

                <div class="drill-level-title">
                    📚 Epics <span class="count">${backlog.epics.length}</span>
                </div>

                ${backlog.epics.map((epic, idx) => `
                    <div class="drill-item" onclick="drillIntoEpic(${idx})">
                        <div class="drill-item-info">
                            <div class="drill-item-title">${epic.title}</div>
                            <div class="drill-item-meta">
                                ${epic.story_points} SP | ${epic.function_points} FP |
                                ${epic.features.length} features
                            </div>
                        </div>
                        <span class="drill-item-badge">${epic.status}</span>
                        <span class="drill-item-arrow">→</span>
                    </div>
                `).join('')}
            `;
        }

        function drillIntoEpic(epicIdx) {
            const epic = currentBacklog.epics[epicIdx];
            navigationStack.push({ type: 'epic', title: epic.title, epicIdx });
            renderFeatures(epic);
        }

        function renderFeatures(epic) {
            const modalBody = document.getElementById('modalBody');

            modalBody.innerHTML = `
                ${renderBreadcrumb()}

                <div class="drill-level-title">
                    📁 Features <span class="count">${epic.features.length}</span>
                </div>

                ${epic.features.length === 0 ? `
                    <div class="no-backlog">
                        <h4>Geen features</h4>
                        <p>Deze epic heeft nog geen features.</p>
                    </div>
                ` : epic.features.map((feature, idx) => `
                    <div class="drill-item" onclick="drillIntoFeature(${navigationStack[0].epicIdx}, ${idx})">
                        <div class="drill-item-info">
                            <div class="drill-item-title">${feature.title}</div>
                            <div class="drill-item-meta">${feature.stories.length} stories</div>
                        </div>
                        <span class="drill-item-badge">${feature.status}</span>
                        <span class="drill-item-arrow">→</span>
                    </div>
                `).join('')}
            `;
        }

        function drillIntoFeature(epicIdx, featureIdx) {
            const feature = currentBacklog.epics[epicIdx].features[featureIdx];
            navigationStack.push({ type: 'feature', title: feature.title, featureIdx });
            renderStories(feature);
        }

        function renderStories(feature) {
            const modalBody = document.getElementById('modalBody');

            modalBody.innerHTML = `
                ${renderBreadcrumb()}

                <div class="drill-level-title">
                    📝 Stories <span class="count">${feature.stories.length}</span>
                </div>

                ${feature.stories.length === 0 ? `
                    <div class="no-backlog">
                        <h4>Geen stories</h4>
                        <p>Deze feature heeft nog geen stories.</p>
                    </div>
                ` : feature.stories.map((story, idx) => `
                    <div class="drill-item" onclick="drillIntoStory(${navigationStack[0].epicIdx}, ${navigationStack[1].featureIdx}, ${idx})">
                        <div class="drill-item-info">
                            <div class="drill-item-title">${story.title}</div>
                            <div class="drill-item-meta">
                                ${story.story_points} SP | ${story.function_points} FP |
                                ${story.tasks.length} tasks
                            </div>
                        </div>
                        <span class="drill-item-badge">${story.status}</span>
                        <span class="drill-item-arrow">→</span>
                    </div>
                `).join('')}
            `;
        }

        function drillIntoStory(epicIdx, featureIdx, storyIdx) {
            const story = currentBacklog.epics[epicIdx].features[featureIdx].stories[storyIdx];
            navigationStack.push({ type: 'story', title: story.title, storyIdx });
            renderTasks(story);
        }

        function renderTasks(story) {
            const modalBody = document.getElementById('modalBody');

            modalBody.innerHTML = `
                ${renderBreadcrumb()}

                <div class="drill-level-title">
                    ✅ Tasks <span class="count">${story.tasks.length}</span>
                </div>

                ${story.tasks.length === 0 ? `
                    <div class="no-backlog">
                        <h4>Geen tasks</h4>
                        <p>Deze story heeft nog geen tasks.</p>
                    </div>
                ` : story.tasks.map(task => `
                    <div class="task-item">
                        <div class="task-title">${task.title}</div>
                        <div class="task-meta">
                            <span>📊 ${task.story_points} SP</span>
                            <span>🎯 ${task.category || 'General'}</span>
                            <span class="drill-item-badge">${task.status}</span>
                        </div>
                    </div>
                `).join('')}
            `;
        }

        function renderBreadcrumb() {
            let crumbs = `<button class="drill-back" onclick="goBack()">← Terug</button>`;
            crumbs += `<span class="drill-crumb" onclick="goToLevel(-1)">${currentBacklog.name}</span>`;

            navigationStack.forEach((item, idx) => {
                crumbs += `<span class="drill-sep">›</span>`;
                if (idx === navigationStack.length - 1) {
                    crumbs += `<span class="drill-current">${item.title}</span>`;
                } else {
                    crumbs += `<span class="drill-crumb" onclick="goToLevel(${idx})">${item.title}</span>`;
                }
            });

            return `<div class="drill-nav">${crumbs}</div>`;
        }

        function goBack() {
            if (navigationStack.length === 0) return;

            navigationStack.pop();

            if (navigationStack.length === 0) {
                renderEpics();
            } else if (navigationStack.length === 1) {
                const epicIdx = navigationStack[0].epicIdx;
                renderFeatures(currentBacklog.epics[epicIdx]);
            } else if (navigationStack.length === 2) {
                const epicIdx = navigationStack[0].epicIdx;
                const featureIdx = navigationStack[1].featureIdx;
                renderStories(currentBacklog.epics[epicIdx].features[featureIdx]);
            }
        }

        function goToLevel(level) {
            if (level === -1) {
                navigationStack = [];
                renderEpics();
                return;
            }

            // Pop until we reach the level
            while (navigationStack.length > level + 1) {
                navigationStack.pop();
            }

            if (navigationStack.length === 0) {
                renderEpics();
            } else if (navigationStack.length === 1) {
                const epicIdx = navigationStack[0].epicIdx;
                renderFeatures(currentBacklog.epics[epicIdx]);
            } else if (navigationStack.length === 2) {
                const epicIdx = navigationStack[0].epicIdx;
                const featureIdx = navigationStack[1].featureIdx;
                renderStories(currentBacklog.epics[epicIdx].features[featureIdx]);
            } else if (navigationStack.length === 3) {
                const epicIdx = navigationStack[0].epicIdx;
                const featureIdx = navigationStack[1].featureIdx;
                const storyIdx = navigationStack[2].storyIdx;
                renderTasks(currentBacklog.epics[epicIdx].features[featureIdx].stories[storyIdx]);
            }
        }

        function closeModal() {
            document.getElementById('detailsModal').classList.remove('active');
        }

        function closeModalOnOverlay(event) {
            if (event.target.classList.contains('modal-overlay')) {
                closeModal();
            }
        }

        // Close modal on ESC key
        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape') {
                closeModal();
            }
        });

        function openDocs(rootPath) {
            const docPath = rootPath.replace('/src', '/doc');
            alert(`Documentatie pad: ${docPath}`);
        }

        function runTests(appName) {
            alert(`Tests starten voor ${appName} - via Tessa agent`);
        }

        async function deleteProject(projectId, projectName) {
            if (!confirm(`Weet je zeker dat je "${projectName}" wilt verwijderen?\n\nDit verwijdert:\n- Alle technical debt items\n- Alle applicaties en componenten\n- Alle stack agents\n- Alle gerelateerde data\n\nDit kan niet ongedaan worden gemaakt!`)) {
                return;
            }

            try {
                const response = await fetch(`${API_BASE}/project-registration/projects/${projectId}?delete_database=true`, {
                    method: 'DELETE'
                });

                if (!response.ok) {
                    const error = await response.json();
                    throw new Error(error.detail || 'Verwijderen mislukt');
                }

                const result = await response.json();
                alert(`Project "${projectName}" is verwijderd.\n\nVerwijderd uit database:\n${Object.entries(result.database_items_deleted || {}).map(([k,v]) => `- ${k}: ${v}`).join('\n')}`);

                // Reload the page to refresh the list
                loadApplications();
            } catch (error) {
                console.error('Delete error:', error);
                alert(`Fout bij verwijderen: ${error.message}`);
            }
        }

        // Tab state
        let currentTab = 'backlog';
        let brownPaperData = null;

        function switchTab(tab) {
            currentTab = tab;
            document.getElementById('tabBacklog').classList.toggle('active', tab === 'backlog');
            document.getElementById('tabAnalysis').classList.toggle('active', tab === 'analysis');

            if (tab === 'backlog') {
                if (currentBacklog) {
                    renderEpics();
                } else {
                    document.getElementById('modalBody').innerHTML = '<div class="loading">Backlog laden</div>';
                }
            } else {
                loadBrownPaperData();
            }
        }

        async function loadBrownPaperData() {
            const modalBody = document.getElementById('modalBody');
            modalBody.innerHTML = '<div class="loading">Code analyse laden</div>';

            try {
                // Get Brown Paper sessions for this application
                const response = await fetch(`${API_BASE}/brown-paper/sessions?application_id=${currentAppId}`);
                const sessions = await response.json();

                if (!sessions || sessions.length === 0) {
                    modalBody.innerHTML = `
                        <div class="no-backlog">
                            <h4>Geen code analyse gevonden</h4>
                            <p>Er is nog geen Brown Paper analyse uitgevoerd voor dit project.</p>
                            <button class="btn btn-primary" onclick="startBrownPaper()">Start Analyse</button>
                        </div>
                    `;
                    return;
                }

                // Get latest session
                const latestSession = sessions[sessions.length - 1];
                const detailResponse = await fetch(`${API_BASE}/brown-paper/sessions/${latestSession.id}`);
                brownPaperData = await detailResponse.json();

                renderBrownPaper();

            } catch (error) {
                console.error('Error loading Brown Paper:', error);
                modalBody.innerHTML = `
                    <div class="no-backlog">
                        <h4>Fout bij laden</h4>
                        <p>${error.message}</p>
                    </div>
                `;
            }
        }

        function renderBrownPaper() {
            const modalBody = document.getElementById('modalBody');
            const analysis = brownPaperData.analysis;
            const constitution = brownPaperData.constitution;

            const domainsHtml = analysis.domains ? analysis.domains.slice(0, 10).map(d => `
                <div class="domain-card">
                    <div class="domain-name">${d.name}</div>
                    <div class="domain-meta">${d.modules?.length || 0} modules | ${d.complexity || 'medium'} complexity</div>
                </div>
            `).join('') : '<p>Geen domeinen gedetecteerd</p>';

            const risksHtml = constitution?.risks ? constitution.risks.map(r => `
                <div class="risk-item ${r.severity}">
                    <strong>${r.risk}</strong>
                    <div style="font-size: 0.85rem; color: #aaa; margin-top: 0.25rem;">${r.mitigation}</div>
                </div>
            `).join('') : '';

            modalBody.innerHTML = `
                <div class="stats-section">
                    <div class="stat-item">
                        <div class="num">${analysis.total_classes || 0}</div>
                        <div class="lbl">Classes</div>
                    </div>
                    <div class="stat-item">
                        <div class="num">${analysis.total_functions || 0}</div>
                        <div class="lbl">Functions</div>
                    </div>
                    <div class="stat-item">
                        <div class="num">${analysis.domains?.length || 0}</div>
                        <div class="lbl">Domains</div>
                    </div>
                    <div class="stat-item">
                        <div class="num">${analysis.modules?.length || 0}</div>
                        <div class="lbl">Modules</div>
                    </div>
                </div>

                ${constitution ? `
                    <div class="constitution-section">
                        <h4>Mission</h4>
                        <p>${constitution.mission_vision?.mission || 'Not defined'}</p>
                    </div>
                ` : ''}

                <div class="drill-level-title">
                    Business Domeinen <span class="count">${analysis.domains?.length || 0}</span>
                </div>
                ${domainsHtml}

                ${risksHtml ? `
                    <div class="drill-level-title" style="margin-top: 1.5rem;">
                        Risico's <span class="count">${constitution.risks?.length || 0}</span>
                    </div>
                    ${risksHtml}
                ` : ''}

                <div style="margin-top: 1.5rem; padding: 1rem; background: rgba(255,255,255,0.05); border-radius: 8px; font-size: 0.85rem; color: #888;">
                    <strong>Status:</strong> ${brownPaperData.status} |
                    <strong>Analyse tijd:</strong> ${analysis.analysis_time_ms || 0}ms |
                    <strong>Geanalyseerd:</strong> ${new Date(brownPaperData.created_at).toLocaleDateString('nl-NL')}
                </div>
            `;
        }

        async function startBrownPaper() {
            const modalBody = document.getElementById('modalBody');
            modalBody.innerHTML = '<div class="loading">Brown Paper sessie starten</div>';

            try {
                const response = await fetch(`${API_BASE}/brown-paper/sessions`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ application_id: currentAppId })
                });
                const session = await response.json();

                // Start analysis
                await fetch(`${API_BASE}/brown-paper/sessions/${session.id}/analyze`, {
                    method: 'POST'
                });

                // Wait and reload
                setTimeout(() => loadBrownPaperData(), 2000);

            } catch (error) {
                modalBody.innerHTML = `<div class="no-backlog"><h4>Fout</h4><p>${error.message}</p></div>`;
            }
        }

        // Load on page ready
        loadApplications();
    </script>
</body>
</html>
