<svg viewBox="0 0 400 100" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="blueGradLogo" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1A4B8E"/>
      <stop offset="50%" style="stop-color:#2563EB"/>
      <stop offset="100%" style="stop-color:#60A5FA"/>
    </linearGradient>
    <linearGradient id="orangeGradLogo" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#EA580C"/>
      <stop offset="100%" style="stop-color:#F97316"/>
    </linearGradient>
    <linearGradient id="textGradBlue" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#1A4B8E"/>
      <stop offset="100%" style="stop-color:#2563EB"/>
    </linearGradient>
  </defs>

  <!-- Circuit lines radiating outward from icon -->
  <g stroke="#60A5FA" stroke-width="1.5" fill="none" opacity="0.6">
    <path d="M30 25 L10 10"/>
    <path d="M25 50 L5 50"/>
    <path d="M30 75 L10 90"/>
    <path d="M95 30 L110 15"/>
  </g>

  <!-- Circuit dots at line ends -->
  <circle cx="10" cy="10" r="3" fill="#F97316"/>
  <circle cx="5" cy="50" r="2.5" fill="#60A5FA"/>
  <circle cx="10" cy="90" r="3" fill="#F97316"/>
  <circle cx="110" cy="15" r="2.5" fill="#60A5FA"/>

  <!-- Main M shape -->
  <path d="M30 80 L30 20 L55 50 L80 20 L80 80"
        stroke="url(#blueGradLogo)"
        stroke-width="9"
        stroke-linecap="round"
        stroke-linejoin="round"
        fill="none"/>

  <!-- Inner circuit detail on M -->
  <rect x="52" y="46" width="6" height="6" fill="#60A5FA" rx="1"/>

  <!-- Q tail/hook in orange -->
  <path d="M83 72 C90 82, 105 82, 110 62"
        stroke="url(#orangeGradLogo)"
        stroke-width="7"
        stroke-linecap="round"
        fill="none"/>

  <!-- arQed.ai text (M is formed by the icon) -->
  <text x="130" y="58" font-family="system-ui, -apple-system, sans-serif" font-weight="700" font-size="42" letter-spacing="-0.5">
    <tspan fill="#1A4B8E">ar</tspan><tspan fill="#2563EB">Q</tspan><tspan fill="#1A4B8E">ed</tspan><tspan fill="#F97316">.ai</tspan>
  </text>

  <!-- Tagline -->
  <text x="132" y="82" font-family="system-ui, -apple-system, sans-serif" font-weight="500" font-size="11" letter-spacing="2.5">
    <tspan fill="#1A4B8E">INNOVATE</tspan><tspan fill="#60A5FA">.</tspan>
    <tspan fill="#2563EB"> LEAD</tspan><tspan fill="#60A5FA">.</tspan>
    <tspan fill="#F97316"> SUCCEED</tspan><tspan fill="#60A5FA">.</tspan>
  </text>
</svg>
