# Generated Code Detection Patterns
# Used by GeneratedCodeDetector service
#
# Strategy:
# - Generated code: Include in security scans, volume metrics; EXCLUDE from quality metrics
# - Handwritten code: Include in ALL metrics
#
# Add project-specific patterns here to supplement the built-in patterns.

# Directory names that indicate generated code
# These are matched against any directory component in the file path
directories:
  # .NET / Visual Studio
  - "My Project"
  - "Service References"
  - "Web References"
  - "Connected Services"
  - "obj"
  - "bin"

  # JavaScript/TypeScript
  - "node_modules"
  - "dist"
  - "build"
  - ".next"
  - ".nuxt"

  # Go
  - "vendor"

  # Python
  - "site-packages"
  - ".venv"
  - "venv"
  - "__pycache__"
  - ".eggs"

  # Generic
  - "Generated"
  - "__generated__"
  - "auto-generated"
  - "autogen"

# File extensions that indicate generated code
# Include the full suffix (e.g., ".Designer.vb" not just ".vb")
file_extensions:
  # .NET Windows Forms
  - ".Designer.vb"
  - ".Designer.cs"
  - ".designer.vb"
  - ".designer.cs"

  # .NET WPF
  - ".g.cs"
  - ".g.vb"
  - ".g.i.cs"
  - ".g.i.vb"

  # .NET T4 Templates
  - ".generated.cs"
  - ".generated.vb"
  - ".tt.cs"

  # Entity Framework
  - ".edmx.cs"
  - ".edmx.vb"

  # Protocol Buffers
  - ".pb.go"
  - ".pb.cc"
  - ".pb.h"
  - "_pb2.py"
  - "_pb2_grpc.py"
  - ".grpc.pb.go"
  - ".grpc.pb.cc"

  # GraphQL
  - ".graphql.ts"
  - ".graphql.js"
  - ".generated.ts"
  - ".generated.tsx"

  # Minified/Bundled
  - ".min.js"
  - ".min.css"
  - ".bundle.js"
  - ".chunk.js"

# Exact file names that are generated
file_names:
  # .NET Service References
  - "Reference.vb"
  - "Reference.cs"
  - "Reference.svcmap"

  # .NET Resources
  - "Resources.Designer.cs"
  - "Resources.Designer.vb"
  - "Settings.Designer.cs"
  - "Settings.Designer.vb"
  - "AssemblyInfo.cs"
  - "AssemblyInfo.vb"

  # Lock files (package managers)
  - "package-lock.json"
  - "yarn.lock"
  - "pnpm-lock.yaml"
  - "Cargo.lock"
  - "poetry.lock"
  - "Pipfile.lock"
  - "composer.lock"
  - "Gemfile.lock"
  - "go.sum"
  - "packages.lock.json"

# Content markers found in file headers
content_markers:
  # Exact matches (high confidence)
  exact:
    - "<auto-generated>"
    - "</auto-generated>"
    - "DO NOT EDIT"
    - "DO NOT MODIFY"

  # Substring matches (slightly lower confidence)
  contains:
    # Universal
    - "Auto-generated"
    - "auto-generated"
    - "AUTO GENERATED"
    - "This code was generated"
    - "Generated by"
    - "machine generated"
    - "automatically generated"
    - "Autogenerated by"
    - "Generated from"

    # Visual Studio / .NET
    - "ResXFileCodeGenerator"
    - "SettingsSingleFileGenerator"
    - "StronglyTypedResourceBuilder"
    - "Windows Form Designer generated code"

    # Web Services
    - "wsdl.exe"
    - "svcutil.exe"

    # Entity Framework
    - "EdmRelationshipAttribute"

    # Protocol Buffers
    - "Generated by the protocol buffer compiler"
    - "protoc-gen"

    # Thrift
    - "Autogenerated by Thrift Compiler"

    # OpenAPI/Swagger
    - "OpenAPI Generator"
    - "swagger-codegen"
    - "NSwag"

    # GraphQL
    - "graphql-codegen"
    - "GraphQL Code Generator"

# Tool-specific patterns (for detailed reporting)
tool_signatures:
  windows_forms:
    markers:
      - "InitializeComponent"
      - "Windows Form Designer generated code"
    directories:
      - "My Project"

  wcf_service:
    markers:
      - "svcutil.exe"
      - "System.ServiceModel"
    directories:
      - "Service References"
      - "Connected Services"

  web_service:
    markers:
      - "wsdl.exe"
      - "System.Web.Services"
    directories:
      - "Web References"
    file_names:
      - "Reference.vb"
      - "Reference.cs"

  entity_framework:
    markers:
      - "EdmRelationshipAttribute"
      - "EntityFramework"
    extensions:
      - ".edmx.cs"
      - ".edmx.vb"

  protobuf:
    markers:
      - "Generated by the protocol buffer compiler"
      - "protoc-gen"
    extensions:
      - ".pb.go"
      - ".pb.cc"
      - "_pb2.py"

  openapi:
    markers:
      - "OpenAPI Generator"
      - "swagger-codegen"
      - "NSwag"
